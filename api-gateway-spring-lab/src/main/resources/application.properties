spring.application.name=api-gateway-spring-lab

server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true


spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cloud.gateway.server.webflux.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.server.webflux.default-filters[0].args.key-resolver=#{@ipKeyResolver}

# tracing (Micrometer Tracing + OpenTelemetry, exporta via OTLP para o Jaeger)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
